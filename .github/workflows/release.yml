name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, asset: filemeta2json-linux-x86_64 }
          - { os: macos-14, asset: filemeta2json-macos-arm64 }
          - { os: macos-13, asset: filemeta2json-macos-x86_64 }
          - { os: windows-latest, asset: filemeta2json-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name filemeta2json --paths . bin/filemeta2json
      - name: Rename binary
        shell: bash
        run: |
          src=dist/filemeta2json
          [ -f "$src.exe" ] && src="$src.exe"
          mv "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
